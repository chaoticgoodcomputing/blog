# The real site's Quartz 5 config (#54): upstream's default, set to the site's own configuration.
#
# Tracked here and reached through the gitignored symlink `quartz/quartz.config.yaml`, which the
# `site-v5` targets create (see VENDORED.md). Local `source:` paths resolve against the vendored
# root, `quartz-v5/quartz/`, so our plugins are `../plugins/<name>` and site plugins
# `../site-plugins/<name>`. Proven by `tests/specs/site-config.spec.mjs`.
#
# Kept in upstream's plugin order, so it diffs cleanly against `quartz/quartz.config.default.yaml`.
# Where a setting departs from stock, the comment says why, citing the decision (map: #18). Plugins
# that replace a stock one (tags, graph, post listing, SEO...) arrive with their own tickets.
#
# Breakpoints (1000/1300, #22) are not here: core compiles them into Sass, so the site re-declares
# its grid in its own CSS, in the `site-styles` site plugin (#64).

# yaml-language-server: $schema=./quartz/quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Chaotic Good Computing
  # v4's " | Spencer Elkington", stock and unconditional: v4's 70-character guard needs core (#42).
  pageTitleSuffix: " | Spencer Elkington"
  enableSPA: true
  enablePopovers: true
  # None in core: PostHog, with v4's privacy options, comes from the cgc-posthog plugin (#61).
  analytics: null
  locale: en-US
  baseUrl: blog.chaoticgood.computer
  ignorePatterns:
    - private
    - templates
    - .obsidian
    # The live .mdx articles import their widgets through v4's registry aliases (`@widgets/…`,
    # `@content/widgets/…`), which cgc-mdx fails the build on, so they sit out until #79 moves
    # them to real imports and deletes these lines.
    - resume.mdx
    - content/notes/ai-beat-us.mdx
    - content/notes/ants-in-the-neighborhood.mdx
    - content/notes/mdx-widgets-test.mdx
    - content/notes/roll-advantage.mdx
    - content/notes/scratch/dice-widget.mdx
    # v4's widget guide, a symlink into the v4 copy until cutover (#48). cgc-mdx's plugin note
    # absorbs it and takes its URL, `/widgets/readme`, as an alias.
    - widgets/README.md
  theme:
    # Self-hosted: core downloads the Google Fonts at build time into `static/fonts/` when CDN
    # caching is off (FORK-LEDGER, "Fonts delete"). v4's typography.
    fontOrigin: googleFonts
    cdnCaching: false
    typography:
      header: &headerFont Inter
      body: &bodyFont Inter
      code: &codeFont IBM Plex Mono
    # Both schemes, stock palettes (#41). v4's palette is the stock darkMode one.
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      # v4: an inline `#word` is text, not a tag.
      parseTags: false
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      # v4: desktop only, and not on the index.
      display: desktop-only
      condition: not-index
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      # v4's absolute link resolution (FORK-LEDGER util/path.ts), and external links in a new tab.
      markdownLinkResolution: absolute
      openLinksInNewTab: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      # Core self-hosts the fonts (above). This plugin's own default links Google Fonts from every
      # page, and falls back to upstream's typography, so it gets the site's and loads nothing.
      fontOrigin: local
      header: *headerFont
      body: *bodyFont
      code: *codeFont
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  # The site's own CSS (#64, ADR-0003's site-plugin amendment): the stack declaration, then v4's
  # five ITCSS tiers under `site`, with the 1000/1300 breakpoints. It runs first (`defaultOrder:
  # -1000`), and its stack names only the layers this config loads: enabling a theme means adding
  # the theme's layers to it (site-plugins/site-styles/src/styles/site.scss).
  - source: ../site-plugins/site-styles
    enabled: true
  # The family layer, `cgc`, above core and themes (#30, #63): every cgc-* plugin that emits CSS
  # declares it by name, `dependencies: ["cgc-styles"]`, and the loader holds them to its order.
  - source: ../plugins/cgc-styles
    enabled: true
  # The tag engine (#20, #31, #69): the site's one tag dictionary, v4's `tags:` block. Colour and icon
  # are both inherited from the nearest ancestor that has one, so only tags that differ from their
  # parent are listed; v4 inherited colours only, and matched icons exactly. Each colour is a
  # light-dark() pair: v4's hex is the dark half, and the light half is a deeper shade of it, at 3:1
  # or more against the light scheme's page and badge. Tags with neither get `var(--darkgray)`, where
  # v4 had #888888. The engine publishes icon ids; cgc-tag-list draws them (#71).
  - source: ../plugins/cgc-tags
    enabled: true
    options:
      tags:
        economics: { color: "light-dark(#b35f00, #de8200)", icon: mdi:earth }
        economics/finance: { icon: mdi:currency-usd }
        economics/markets: { icon: mdi:handshake }
        economics/policy: { icon: mdi:script }
        economics/strategy: { icon: mdi:arrow-decision }
        engineering: { color: "light-dark(#0070cc, #008CFF)", icon: mdi:wrench }
        engineering/ai: { icon: mdi:robot }
        engineering/bio: { icon: mdi:dna }
        engineering/data: { icon: mdi:pulse }
        engineering/devops: { icon: mdi:cloud }
        engineering/frontend: { icon: mdi:palette }
        engineering/languages: { icon: mdi:code-braces }
        engineering/languages/csharp: { icon: mdi:language-csharp }
        engineering/languages/lua: { icon: mdi:language-lua }
        engineering/languages/python: { icon: mdi:language-python }
        engineering/languages/scratch: { icon: mdi:cat }
        engineering/languages/typescript: { icon: mdi:language-typescript }
        horticulture: { color: "light-dark(#1a8a1a, #00FF00)", icon: mdi:flower }
        horticulture/seasons: { icon: mdi:weather-sunny }
        horticulture/seasons/rhythm: { icon: mdi:music-note }
        horticulture/seasons/systems: { icon: mdi:connection }
        private: { color: &red "light-dark(#cc0000, #FF0000)", icon: mdi:lock }
        projects: { color: *red, icon: mdi:source-branch }
        projects/dayjob: { icon: mdi:vote }
        projects/flowthru: { icon: mdi:graph-outline }
        projects/games: { icon: custom:d20 }
        projects/games/magic-atlas: { icon: mdi:cards-outline }
        projects/games/roblox: { icon: custom:roblox }
        projects/games/the-neighborhood: { icon: mdi:city }
        projects/homelab: { icon: mdi:home-sound-out }
        projects/site: { icon: custom:quartz-filled }
        projects/teaching: { icon: mdi:school }
        projects/undergrad: { icon: custom:uofu }
        writing: { color: "light-dark(#9a7400, #FFD637)", icon: mdi:pencil }
        writing/annotations: { icon: mdi:chat-plus }
        writing/annotations/a-pattern-language: { icon: mdi:home-city }
        writing/annotations/meetings: { icon: mdi:account-group }
        writing/articles: { icon: mdi:file-edit }
        writing/highlights: { icon: mdi:star }
        writing/tutorials: { icon: mdi:map }
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
    options:
      # On permanently (#23): v4's mixed-case URLs (89 in the vault today) redirect to their
      # lowercase pages. Emitted only where the output filesystem is case-sensitive, as CI's is.
      enableCaseRedirects: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 40
  # What search engines see (#28): `noindex` on private pages, which stay listed on the site, and the
  # canonical URL, `article:*` meta and JSON-LD of v4's Head fork. The sitemap and feed move here in #67.
  - source: ../plugins/cgc-seo
    enabled: true
    options:
      noindexTags:
        - private
      # v4 gave article metadata to `content/` pages only.
      articleFolders:
        - content
      # v4's `structuredData`. The author's name is the page title's too (#44), shared as `*author`.
      defaultAuthor:
        type: Person
        name: &author Spencer Elkington
        url: https://blog.chaoticgood.computer/about
      publisher:
        type: Organization
        name: Chaotic Good Computing
        url: https://blog.chaoticgood.computer/about
        # The site icon, which is 184px square (#70 copies it into the build).
        logo:
          width: 184
          height: 184
      articleTypes:
        - { tag: writing/annotations, type: ScholarlyArticle, section: Annotations }
        - { tag: writing/tutorials, type: HowTo, section: Tutorials }
        - { tag: writing/articles, type: Article, section: Articles }
        - { tag: engineering, type: TechArticle, section: Engineering }
        - { tag: economics, type: Article, section: Economics }
        - { tag: horticulture, type: BlogPosting, section: Digital Garden }
        - { tag: projects, type: Report, section: Projects }
      defaultArticleType: Article
  - source: "@quartz-community/favicon"
    enabled: true
  # Replaced by cgc-og-image, which wraps it (#58).
  - source: "@quartz-community/og-image"
    enabled: false
  # v4's cards: last-segment tag chips, the site's icon, and none drawn under `serve` (#42, #44).
  - source: ../plugins/cgc-og-image
    enabled: true
    options:
      # v4's OG images are dark (FORK-LEDGER ogImage.tsx).
      colorScheme: darkMode
      # The site's own icon, `quartz-v5/icon.png`, resolved against the vendored root.
      icon: ../icon.png
  - source: "@quartz-community/cname"
    enabled: true
  # v4's PostHog (#42, #44, #61), in place of core `analytics`: nothing loads under Do Not Track, no
  # session recording, and a `navigation` event per followed link, labelled as v4 labelled it. v4's
  # other two labels arrive with their places: the tag explorer's (#76) here, and the graph's, which
  # cgc-graph sends itself (FORK-LEDGER graph rows).
  - source: ../plugins/cgc-posthog
    enabled: true
    options:
      apiKey: phc_BviHJVml66FIB1RFmgeAzZpKRWA0nntGdIOo47hTA3X
      apiHost: https://app.posthog.com
      navigationSources:
        # v4 labelled a link in the tag list, or any tag link, a tag badge: cgc-tag-list's badges
        # (#69), and the `.tag-link`s of page listings and inline #tags.
        ".cgc-tag-list": tag-badge
        # The post listing's badges (#73). A post's title in the listing is `other`, as in v4.
        ".cgc-post-listing__tags": tag-badge
        ".tag-link": tag-badge
        "a.internal": inline-link
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  # Annotation pages (#37): a note with an `annotation-target` gets the full-width frame, and the
  # Viewer beside its annotations (#68). Each annotation page's source document is mirrored into the
  # site, pinned in the default cache, `node_modules/.cache/cgc-annotator/` (#59). The site's
  # `robots.txt` keeps the mirrors out of search. Notes are rendered with the default denylist: #37
  # swapped v4's hand-picked list, which left out maths, for the site's whole pipeline. Its default
  # order, 75, puts it after crawl-links and description, whose `links` and `text` it adds to.
  - source: ../plugins/cgc-annotator
    enabled: true
    options:
      mirrorDir: assets/annotated-documents
  # `.mdx` pages, at their extensionless URLs, with widgets as islands (#19, #24, #65).
  - source: ../plugins/cgc-mdx
    enabled: true
  # Folder pages are dropped (#42, #43): never in the sitemap or linked, and the tag description
  # files (`tags/<t>/index.md`) would render as folder pages.
  - source: "@quartz-community/folder-page"
    enabled: false
  - source: "@quartz-community/tag-page"
    enabled: true
  # A file explorer is in no v4 layout (#42). The tag explorer, with its own drawer, is #76.
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  # Replaced by cgc-graph, in the same slot.
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  # v4's graph (#74), drawn from its own index, which carries each page's date (#21), with v4's
  # settings (layouts/conf/graph.layout.ts): the local graph on every page, and the global graph in
  # v4's pseudo-shell, its top-level tags pinned to a ring, filtered to the last month, or wider until
  # three pages show. Private pages are drawn in v4's red and hidden from the global graph as it
  # opens, and the `private` tag hub is left out. v4 put the graph in the body of the index and tag
  # pages; a plugin takes one layout slot, so they have it in the right sidebar too. Tag colours and
  # icons in the graph are #77.
  - source: ../plugins/cgc-graph
    enabled: true
    options:
      privateTags:
        - private
      localGraph:
        scale: 1
        repelForce: 3
        centerForce: 1.75
        linkDistance: { tagTag: 50, tagPost: 50, postPost: 50 }
        linkStrength: { tagTag: 0.3, tagPost: 0.3, postPost: 0.3 }
        edgeOpacity:
          tagTag: { min: 1, max: 1 }
          tagPost: { min: 0.75, max: 1 }
          postPost: { min: 0.5, max: 1 }
        baseSize: { tags: 10, posts: 10 }
        sizeScaling: &sizeScaling { tags: 1.2, posts: 1 }
        nodeColors: &nodeColors { private: "#c54040" }
        linkStyle: &linkStyle { tagTag: solid, tagPost: solid, postPost: dotted }
        privatePostSizeMultiplier: 0.8
        removeTags: &removeTags [private]
        expandSelectedSize: 1.4
        expandSelectedOscillationTime: 2
      globalGraph:
        scale: 1
        repelForce: 3
        centerForce: 1.75
        linkDistance: { tagTag: 50, tagPost: 10, postPost: 10 }
        linkStrength: { tagTag: 1, tagPost: 0.5, postPost: 0.05 }
        edgeOpacity:
          tagTag: { min: 0.8, max: 1 }
          tagPost: { min: 0.2, max: 1 }
          postPost: { min: 0.2, max: 1 }
        baseSize: { tags: 15, posts: 10 }
        sizeScaling: *sizeScaling
        nodeColors: *nodeColors
        linkStyle: *linkStyle
        privatePostSizeMultiplier: 0.8
        removeTags: *removeTags
        defaultFilterState:
          timePeriod: month
          includePrivate: false
          adaptiveTimePeriod: { minPosts: 3 }
        expandSelectedSize: 1.4
        expandSelectedOscillationTime: 2
        graphStyle: pseudo-shell
        pseudoShellConfig:
          radiusBase: 90
          radiusScale: 40
          circumferentialRepulsion: 4
          zoomMargin: 80
          pinnedTags: [engineering, writing, horticulture, projects, economics]
          showShell: true
          shellStyle: { opacity: 0.5, lineStyle: dotted, lineWidth: 2 }
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
      # v4's index has no backlinks.
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      # v4's index shows no date or reading time.
      condition: not-index
  # Replaced by cgc-tag-list, in the same slot.
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  # v4's TagList under a page's title (#69): badges ringed in their tag's colour and drawn with its
  # icon (#71), each with the count of pages under it. A tag page lists its parent and subtags
  # instead, as v4's tags layout did.
  - source: ../plugins/cgc-tag-list
    enabled: true
    options:
      showSubtags: true
      showParentTag: true
      # The site's own icon collection (#29, #71): `custom:` is quartz-v5/icons/, v4's five SVGs, as
      # the site wrote them. They're turned into currentColor icons when the site builds. Every
      # plugin that draws icons takes it, through the anchor. Resolved against the vendored root.
      iconCollections: &iconCollections
        custom: ../icons
    layout:
      position: beforeBody
      priority: 30
  # v4's PostListing (#42, #44, #73): every post, newest first with same-date posts A→Z, each ringed in
  # its tags' colours, the first five shown. v4 put it after the body of the index, the 404 page and
  # the tags layout, where it lists the tag's posts. Quartz 5 has no `is-index` condition a plugin can
  # add (#70), so the listing keeps to the pages `showOn` names, and to tag pages, by itself.
  - source: ../plugins/cgc-post-listing
    enabled: true
    options:
      showOn:
        - index
        - "404"
      collapsedItemCount: 5
    layout:
      position: afterBody
      priority: 10
  # Replaced by site-components' page title, below (#44, #70).
  - source: "@quartz-community/page-title"
    enabled: false
  # v4's page title: the site's icon, the title and "by <author>" (#44, #70). The loader places one
  # component per entry, found by the entry's name in PascalCase, so site-components is listed once
  # per component, each entry named for it (site-plugins/site-components/CONTEXT.md, "Placement").
  - source:
      repo: ../site-plugins/site-components
      name: site-page-title
    enabled: true
    options:
      # Fixed for the site, and the one cgc-seo credits: one anchor, set once (#44).
      author: *author
    layout:
      position: left
      priority: 10
  # Both schemes (#41): the stock toggle in its stock slot. Its script follows the OS scheme on first
  # load and falls back to dark when the browser reports none.
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # In no v4 layout.
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  # In no v4 layout.
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # v4's subscribe box under a note (#42, #44), with v4's note-page wording. v4 also had it in the
  # right sidebar of the index and tag pages, as "Newsletter": a plugin takes one layout slot, so
  # those pages have it here, after the body, too.
  - source: ../plugins/cgc-email-subscribe
    enabled: true
    options:
      buttondownUsername: chaoticgoodcomputing
      title: Subscribe for more!
      description: Be notified weekly about any fresh notes or articles!
    layout:
      position: afterBody
      priority: 20
  # v4's "View source on GitHub", under the subscribe box on notes; not on the index (#42, #44). v4
  # linked the repo's old name, which no longer resolves.
  - source: ../plugins/cgc-page-source
    enabled: true
    options:
      repoUrl: https://github.com/chaoticgoodcomputing/blog/blob/main
      contentPath: content/public
    layout:
      position: afterBody
      priority: 30
      condition: not-index
  # Replaced by site-components' footer, below: stock's takes links only (#44, #70).
  - source: "@quartz-community/footer"
    enabled: false
  # v4's footer: its links, the copyright line, then the Quartz credit (#44, #70). site-components'
  # second entry, named for its component (see the page title's entry).
  - source:
      repo: ../site-plugins/site-components
      name: site-footer
    enabled: true
    options:
      # v4's footer links.
      links:
        Contact: https://blog.chaoticgood.computer/contact
        GitHub: https://github.com/spelkington
        LinkedIn: https://www.linkedin.com/in/spelkington
        Privacy Policy: https://chaoticgood.computer/privacy
        AI Policy: https://chaoticgood.computer/ai-policy
      copyright:
        Spencer Elkington: https://chaoticgood.computer/contact
        Chaotic Good Computing: https://github.com/chaoticgoodcomputing
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # Parses every page's frontmatter, so it stays on. v4 shows no properties table.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    # v4's 404 is in the site's shell, keeping the left navigation, with nothing before the body and
    # nothing on the right. Stock gives it the bare `minimal` frame.
    "404":
      template: default
      # Nor a subscribe box, which v4's 404 did not have.
      exclude:
        - cgc-email-subscribe
      positions:
        beforeBody: []
        right: []
    content: {}
    # v4's annotation pages had no source link, which would show Annotator's JSON (#68). Their
    # full-width frame has no sidebars, so the graph and backlinks (right) are not on them.
    annotation:
      exclude:
        - cgc-page-source
    # v4's tag pages had no source link. A tag page drawn from a description file would get one.
    tag:
      exclude:
        - cgc-page-source
    canvas: {}
    bases: {}
