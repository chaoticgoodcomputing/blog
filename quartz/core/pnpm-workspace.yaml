# Quartz Core is a pnpm project of its own, outside the repo's workspace: pnpm stops at the nearest
# workspace file, so the repo's root install never reaches it (quartz/VENDORED.md). Its
# package.json is exactly upstream's, and its lock is `pnpm import`ed from upstream's
# package-lock.json at the pinned ref, so it installs exactly the versions upstream ships
# (utils/core-lock.mjs checks it). Hoisted, so node_modules is flat and npm-shaped, as plugins
# resolve Core's packages under npm. Peers are never auto-installed, and only these dependencies may
# run build scripts.
packages:
  - "."
nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
