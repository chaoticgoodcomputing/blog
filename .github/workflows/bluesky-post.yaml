name: Post New Content to Bluesky

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types:
      - completed

permissions:
  contents: read

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout pages branch RSS feed
        uses: actions/checkout@v4
        with:
          ref: pages
          sparse-checkout: |
            index.xml
          sparse-checkout-cone-mode: false
          path: pages-rss

      - name: Check RSS and post to Bluesky
        env:
          ATPROTO_POST_KEY: ${{ secrets.ATPROTO_POST_KEY }}
          ATPROTO_IDENTIFIER: chaoticgood.computer
          RSS_FILE: pages-rss/index.xml
        run: |
          node .github/workflows/scripts/post-to-bluesky.mjs
