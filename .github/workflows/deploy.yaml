name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Force deployment even if not affected"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # STAGE 1: Determine what needs to run
  # ============================================================================

  check-affected:
    name: Check what's affected
    runs-on: ubuntu-latest
    outputs:
      site-affected: ${{ steps.check.outputs.site-affected }}
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      weekly-note: ${{ steps.check-weekly.outputs.file }}
      force-reason: ${{ steps.check.outputs.force-reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if site is affected
        id: check
        run: |
          FORCE_DEPLOY="false"
          FORCE_REASON=""

          # Check for force deployment via workflow dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_DEPLOY="true"
            FORCE_REASON="Manual workflow dispatch with force=true"
          fi

          # Check for force deployment via commit message
          if [ "${{ github.event_name }}" = "push" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qiE '\[deploy\]|\[force-deploy\]|\[skip-affected\]'; then
              FORCE_DEPLOY="true"
              FORCE_REASON="Commit message contains deployment flag"
              echo "Found deployment flag in commit message"
            fi
          fi

          # Check if site project is affected by changes
          if [ "${{ github.event_name }}" = "push" ] && [ "$FORCE_DEPLOY" != "true" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 Changed files in this push:"
            git diff --name-only HEAD^ HEAD | while read file; do
              echo "  - $file"
            done
            echo ""
            
            echo "🔍 Running: nx show projects --affected --base=HEAD~1 --head=HEAD --targets=build"
            AFFECTED_PROJECTS=$(pnpm nx show projects --affected --base=HEAD~1 --head=HEAD --targets=build)
            echo "📦 Affected projects with build targets:"
            if [ -z "$AFFECTED_PROJECTS" ]; then
              echo "  (none)"
            else
              echo "$AFFECTED_PROJECTS" | while read project; do
                echo "  - $project"
              done
            fi
            echo ""
            
            SITE_AFFECTED=$(echo "$AFFECTED_PROJECTS" | grep -q "^site$" && echo "true" || echo "false")
            echo "site-affected=$SITE_AFFECTED" >> $GITHUB_OUTPUT
            
            if [ "$SITE_AFFECTED" = "true" ]; then
              echo "should-deploy=true" >> $GITHUB_OUTPUT
              echo "✓ Site is affected by changes - deployment needed"
            else
              echo "should-deploy=false" >> $GITHUB_OUTPUT
              echo "○ Site is not affected - skipping deployment"
              echo ""
              echo "💡 To force deployment, use one of:"
              echo "  - Commit message with [deploy], [force-deploy], or [skip-affected]"
              echo "  - Manual workflow_dispatch with force=true"
            fi
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            # Force deployment
            echo "site-affected=true" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "✓ Forcing deployment: $FORCE_REASON"
          fi

          echo "force-reason=$FORCE_REASON" >> $GITHUB_OUTPUT

      - name: Check for weekly notes
        id: check-weekly
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Find newly added or modified weekly notes
            CHANGED_FILES=$(git diff --name-only --diff-filter=AM HEAD^ HEAD | grep '^content/public/content/notes/periodic/weekly/.*\.md$' || true)
            
            if [ -n "$CHANGED_FILES" ]; then
              FIRST_FILE=$(echo "$CHANGED_FILES" | head -n 1)
              echo "file=$FIRST_FILE" >> $GITHUB_OUTPUT
              echo "✓ Found weekly note: $FIRST_FILE"
            else
              echo "file=" >> $GITHUB_OUTPUT
              echo "○ No weekly notes changed"
            fi
          else
            echo "file=" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # STAGE 2: Build and deploy the site
  # ============================================================================

  deploy:
    name: Build and deploy
    needs: check-affected
    if: needs.check-affected.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      rss-changed: ${{ steps.compare-rss.outputs.changed }}
      sitemap-changed: ${{ steps.compare-sitemap.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check previous RSS feed
        id: check-previous-rss
        run: |
          if wget -q https://blog.chaoticgood.computer/index.xml -O /tmp/previous-rss.xml 2>/dev/null; then
            PREV_RSS_HASH=$(sha256sum /tmp/previous-rss.xml | awk '{print $1}')
            echo "hash=$PREV_RSS_HASH" >> $GITHUB_OUTPUT
            echo "✓ Previous RSS hash: $PREV_RSS_HASH"
          else
            echo "hash=" >> $GITHUB_OUTPUT
            echo "○ No previous RSS feed found"
          fi

      - name: Check previous sitemap
        id: check-previous-sitemap
        run: |
          if wget -q https://blog.chaoticgood.computer/sitemap.xml -O /tmp/previous-sitemap.xml 2>/dev/null; then
            PREV_SITEMAP_HASH=$(sha256sum /tmp/previous-sitemap.xml | awk '{print $1}')
            echo "hash=$PREV_SITEMAP_HASH" >> $GITHUB_OUTPUT
            echo "✓ Previous sitemap hash: $PREV_SITEMAP_HASH"
          else
            echo "hash=" >> $GITHUB_OUTPUT
            echo "○ No previous sitemap found"
          fi

      - name: Build site
        run: pnpm nx run site:build

      - name: Compare RSS feeds
        id: compare-rss
        run: |
          if [ -f dist/public/index.xml ]; then
            CURRENT_RSS_HASH=$(sha256sum dist/public/index.xml | awk '{print $1}')
            PREVIOUS_RSS_HASH="${{ steps.check-previous-rss.outputs.hash }}"
            
            if [ -z "$PREVIOUS_RSS_HASH" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✓ RSS changed: First deployment"
            elif [ "$CURRENT_RSS_HASH" != "$PREVIOUS_RSS_HASH" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✓ RSS changed: $PREVIOUS_RSS_HASH → $CURRENT_RSS_HASH"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "○ RSS unchanged"
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⚠ No RSS feed found"
          fi

      - name: Compare sitemaps
        id: compare-sitemap
        run: |
          if [ -f dist/public/sitemap.xml ]; then
            CURRENT_SITEMAP_HASH=$(sha256sum dist/public/sitemap.xml | awk '{print $1}')
            PREVIOUS_SITEMAP_HASH="${{ steps.check-previous-sitemap.outputs.hash }}"
            
            if [ -z "$PREVIOUS_SITEMAP_HASH" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✓ Sitemap changed: First deployment"
            elif [ "$CURRENT_SITEMAP_HASH" != "$PREVIOUS_SITEMAP_HASH" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "✓ Sitemap changed: $PREVIOUS_SITEMAP_HASH → $CURRENT_SITEMAP_HASH"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "○ Sitemap unchanged"
            fi
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⚠ No sitemap found"
          fi

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/public
          publish_branch: pages
          force_orphan: true

  # ============================================================================
  # STAGE 3: Post to Bluesky (only if RSS changed)
  # ============================================================================

  post-to-bluesky:
    name: Post to Bluesky
    needs: deploy
    if: needs.deploy.outputs.rss-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout pages branch RSS feed
        uses: actions/checkout@v4
        with:
          ref: pages
          sparse-checkout: |
            index.xml
          sparse-checkout-cone-mode: false
          path: pages-rss

      - name: Check RSS and post to Bluesky
        env:
          ATPROTO_POST_KEY: ${{ secrets.ATPROTO_POST_KEY }}
          ATPROTO_IDENTIFIER: chaoticgood.computer
          RSS_FILE: pages-rss/index.xml
        run: |
          node .github/workflows/scripts/post-to-bluesky.mjs

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ## 🦋 Bluesky Post Complete

          🌐 Profile: https://bsky.app/profile/chaoticgood.computer
          EOF

  # ============================================================================
  # STAGE 4: Send weekly email (independent of deployment)
  # ============================================================================

  send-weekly-email:
    name: Send weekly email
    needs: check-affected
    if: needs.check-affected.outputs.weekly-note != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Send weekly email
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_POST_KEY }}
        run: |
          node .github/workflows/scripts/send-weekly-email.mjs \
            --file "${{ needs.check-affected.outputs.weekly-note }}"

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 📧 Weekly Email Sent

          Successfully sent weekly email:
          - ✅ Note: ${{ needs.check-affected.outputs.weekly-note }}

          📬 Newsletter: https://buttondown.com/chaoticgoodcomputing
          EOF

  # ============================================================================
  # STAGE 5: Notify search engines (IndexNow)
  # ============================================================================

  notify-indexnow:
    name: Notify search engines
    needs: deploy
    if: needs.deploy.outputs.sitemap-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout pages branch sitemap
        uses: actions/checkout@v4
        with:
          ref: pages
          sparse-checkout: |
            sitemap.xml
          sparse-checkout-cone-mode: false
          path: pages-sitemap

      - name: Submit URLs to IndexNow
        run: |
          pnpm nx run site:indexnow --sitemap=pages-sitemap/sitemap.xml

      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ## 🔍 IndexNow Submission Complete

          🌐 Site: https://blog.chaoticgood.computer
          EOF
