# Builds the site with Astro (astro/) and publishes it to the `pages` branch, which GitHub Pages
# serves at blog.chaoticgood.computer (#81; astro/docs/adr/3001). Deliberately minimal for now: no
# tests, no affected check; every push to main rebuilds and redeploys the whole site
# (astro/docs/cutover/deploy.md). After a deploy, the IndexNow job tells Bing and the other IndexNow
# engines which pages it changed, the webmention job sends the webmentions it owes the sites its
# notes link to, the Bluesky job posts each feed item @chaoticgood.computer hasn't yet, and after a
# push's deploy, the email job drafts a Buttondown email from each note it made an email. A daily
# deploy shows the mentions webmention.io received since the last. When the Bluesky job posted, it
# deploys again, so that the new notes' pages link to their posts.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Daily, for the mentions webmention.io received (astro/src/lib/mentions.ts).
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Submit every page in the sitemap to IndexNow, not just the changed ones"
        type: boolean
        default: false
      send_all_webmentions:
        description: "Send a webmention for every mention excerpt, not just the changed ones"
        type: boolean
        default: false

permissions:
  contents: write

# One deploy at a time. A newer push waits rather than cancelling a deploy halfway through.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      # Full history: a note's date falls back to git's, the newest commit to touch it
      # (astro/src/lib/dates.ts), and in a shallow clone that is the tip for every note. The private
      # vault, content/private, is a submodule on another host and is never checked out.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The version comes from package.json's `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The resume is compiled here, by `resume:build`, which astro:build depends on, and published
      # from dist/resume (astro/src/lib/resume.ts). Typst is the release used locally, the official
      # static binary checked against its hash, so the PDF is the one a local build makes: the
      # resume's font, New Computer Modern, is built into Typst, and it imports no packages.
      - name: Install Typst
        env:
          TYPST_VERSION: 0.14.2
          TYPST_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
        run: |
          curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TOOL_CACHE/typst"
          tar -xJf typst.tar.xz -C "$RUNNER_TOOL_CACHE/typst" --strip-components=1
          rm typst.tar.xz
          echo "$RUNNER_TOOL_CACHE/typst" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The private notes' stubs, dist/vault-private, must publish nothing but the placeholder
      # (content/utils/guard-private.ts). The commit hook checks them too, but can be skipped; this is
      # the last check before the site is built from them.
      - name: Check the private notes' stubs
        run: pnpm nx run vault:guard-private

      # The mirrors of annotated documents are kept between deploys, so a mirror stays the copy first
      # saved and a host that refuses CI's runners costs nothing once its document is saved
      # (astro/docs/adr/2801). They live in dist/mirrors, outside node_modules, never in the vault.
      # The newest set is restored; astro:mirrors adds what is missing.
      - name: Restore the annotated documents' mirrors
        id: mirrors
        uses: actions/cache/restore@v6
        with:
          path: dist/mirrors
          key: annotation-mirrors-${{ github.sha }}
          restore-keys: annotation-mirrors-

      # The only step that reaches the documents' hosts. One that can't be fetched is reported and
      # its page built without the viewer; the step still succeeds.
      - name: Save missing mirrors
        run: pnpm nx run astro:mirrors

      # Named by what the directory holds, so a new set is saved only when a mirror was added.
      - name: Keep the mirrors
        if: hashFiles('dist/mirrors/**') != '' && steps.mirrors.outputs.cache-matched-key != format('annotation-mirrors-{0}', hashFiles('dist/mirrors/**'))
        uses: actions/cache/save@v6
        with:
          path: dist/mirrors
          key: annotation-mirrors-${{ hashFiles('dist/mirrors/**') }}

      # Share cards are named by the hash of everything they are drawn from, so the newest set is
      # always safe to start from: a page that changed draws a new card, the rest are read
      # (astro/docs/adr/1701). Only this directory of Astro's cache is kept: the content layer's
      # rendered notes don't know a Markdown plugin's code changed.
      - name: Restore the share cards
        id: share-cards
        uses: actions/cache/restore@v6
        with:
          path: astro/node_modules/.astro/share-cards
          key: share-cards-${{ github.sha }}
          restore-keys: share-cards-

      # Search, the share cards, the mirrors and the attachments are all made by the build itself,
      # through its integrations and endpoints.
      - name: Build site
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: pnpm nx run astro:build

      - name: Keep the share cards
        if: hashFiles('astro/node_modules/.astro/share-cards/**') != '' && steps.share-cards.outputs.cache-matched-key != format('share-cards-{0}', hashFiles('astro/node_modules/.astro/share-cards/**'))
        uses: actions/cache/save@v6
        with:
          path: astro/node_modules/.astro/share-cards
          key: share-cards-${{ hashFiles('astro/node_modules/.astro/share-cards/**') }}

      # The sitemaps the site has now, before the deploy replaces them: the IndexNow job submits what
      # changed between these and the build's. The checkout's full history includes origin/pages;
      # without one, nothing is kept and every page is new.
      - name: Keep the deployed sitemaps
        run: |
          mkdir -p indexnow/previous indexnow/next
          for file in $(git ls-tree --name-only origin/pages 2>/dev/null | grep '^sitemap.*\.xml$'); do
            git show "origin/pages:$file" > "indexnow/previous/$file"
          done
          cp astro/dist/sitemap*.xml indexnow/next/
          cp astro/dist/*.txt indexnow/next/

      - name: Upload the sitemaps for IndexNow
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-sitemaps
          path: indexnow/
          retention-days: 7

      # The webmention manifest the site has now, and the build's: the webmention job sends what
      # changed between them (.github/workflows/scripts/webmention.mjs).
      - name: Keep the deployed webmention manifest
        run: |
          mkdir -p webmentions/previous webmentions/next
          git show origin/pages:webmentions.json > webmentions/previous/webmentions.json 2>/dev/null || rm -f webmentions/previous/webmentions.json
          cp astro/dist/webmentions.json webmentions/next/

      - name: Upload the webmention manifests
        uses: actions/upload-artifact@v7
        with:
          name: webmention-manifests
          path: webmentions/
          retention-days: 7

      # force_orphan: the branch holds exactly this build. peaceiris adds .nojekyll, without which
      # Pages' Jekyll would drop `_astro/`, where the site's scripts and stylesheets are; the build
      # carries CNAME and the site's other root files, from astro/public.
      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./astro/dist
          publish_branch: pages
          force_orphan: true

  # The pages the deploy added, removed or gave a new `lastmod`, submitted to IndexNow once the live
  # site serves the new sitemaps (.github/workflows/scripts/indexnow.mjs). Google doesn't take
  # IndexNow and reads the sitemap itself. A failure here leaves the deploy in place.
  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The script needs Node alone, no dependencies.
      - name: Checkout the script
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows/scripts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Download the sitemaps
        uses: actions/download-artifact@v8
        with:
          name: indexnow-sitemaps
          path: indexnow

      - name: Submit the changed pages
        run: node .github/workflows/scripts/indexnow.mjs --previous indexnow/previous --next indexnow/next --wait ${{ inputs.submit_all && '--all' || '' }}

  # The webmentions the deploy owes: for each mention excerpt it added, changed or took out, one to
  # the site the note links to, if that site takes them, once the live site serves the new excerpts
  # (.github/workflows/scripts/webmention.mjs). A failure here leaves the deploy in place.
  webmention:
    name: Send webmentions
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The script needs Node alone, no dependencies.
      - name: Checkout the script
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/workflows/scripts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Download the manifests
        uses: actions/download-artifact@v8
        with:
          name: webmention-manifests
          path: webmentions

      - name: Send the owed webmentions
        run: node .github/workflows/scripts/webmention.mjs --previous webmentions/previous --next webmentions/next --wait ${{ inputs.send_all_webmentions && '--all' || '' }}

  # Each item in the feed that @chaoticgood.computer hasn't posted yet, posted oldest first, with the
  # note's share card (.github/workflows/scripts/post-to-bluesky.mjs). Bridgy follows the replies,
  # likes and reposts back to the note as webmentions. It runs after every deploy, the daily one
  # too: the script skips what the account already posted, so a deploy that added nothing posts
  # nothing. A failure here leaves the deploy in place. When it posted, it deploys again, so that
  # each new note's discussion links to its post (astro/src/lib/bluesky-posts.ts); that deploy
  # posts nothing, and so deploys no further.
  bluesky:
    name: Post to Bluesky
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To start that deploy. A run the workflow's own token starts by `workflow_dispatch` runs.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The script parses the feed with xml2js.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The site as the deploy just published it: the feed, and the share cards the posts show.
      - name: Checkout the pages branch
        uses: actions/checkout@v6
        with:
          ref: pages
          sparse-checkout: |
            index.xml
            share-cards
          sparse-checkout-cone-mode: false
          path: pages-content

      - name: Post the new feed items
        id: post
        env:
          ATPROTO_POST_KEY: ${{ secrets.ATPROTO_POST_KEY }}
          ATPROTO_IDENTIFIER: chaoticgood.computer
          RSS_FILE: pages-content/index.xml
          PAGES_DIR: pages-content
        run: node .github/workflows/scripts/post-to-bluesky.mjs

      - name: Deploy again, to link the new posts
        if: steps.post.outputs.posted != '' && steps.post.outputs.posted != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yaml --repo "$GITHUB_REPOSITORY" --ref main

  # Each public note the push made an email (tagged `writing/notes/emails`, not a draft) becomes a
  # Buttondown draft, after the deploy so its links reach live pages. Only ever a draft: it is sent
  # by hand from Buttondown (.github/workflows/scripts/send-email.mjs).
  email:
    name: Draft emails
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Full history, to compare each note with how it was before the push.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Draft emails in Buttondown
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_POST_KEY }}
        run: node .github/workflows/scripts/send-email.mjs --changed "${{ github.event.before }}" "${{ github.sha }}"
