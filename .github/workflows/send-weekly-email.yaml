name: Send Weekly Email

on:
  push:
    branches:
      - main
    paths:
      - "content/public/content/notes/periodic/weekly/**/*.md"
  workflow_dispatch:
    inputs:
      file:
        description: "Path to weekly note (relative to repo root)"
        required: true
        type: string
      dry_run:
        description: "Dry run mode (outputs JSON without sending)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect new weekly notes
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "file=${{ inputs.file }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            # Find newly added weekly notes in this push
            NEW_FILES=$(git diff --name-only --diff-filter=A HEAD^ HEAD | grep '^content/public/content/notes/periodic/weekly/.*\.md$' || true)
            
            if [ -z "$NEW_FILES" ]; then
              echo "No new weekly notes detected"
              echo "file=" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            # Use the first new file found
            FIRST_FILE=$(echo "$NEW_FILES" | head -n 1)
            echo "file=$FIRST_FILE" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
            echo "Detected new weekly note: $FIRST_FILE"
          fi

      - name: Send weekly email
        if: steps.detect.outputs.file != ''
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_POST_KEY }}
        run: |
          if [ "${{ steps.detect.outputs.dry_run }}" = "true" ]; then
            node .github/workflows/scripts/send-weekly-email.mjs \
              --file "${{ steps.detect.outputs.file }}" \
              --dry-run
          else
            node .github/workflows/scripts/send-weekly-email.mjs \
              --file "${{ steps.detect.outputs.file }}"
          fi

      - name: Commit dry-run output
        if: steps.detect.outputs.dry_run == 'true' && steps.detect.outputs.file != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/public/assets/email-tests/*.json
          git diff --staged --quiet || git commit -m "test: add email dry-run output"
          git push
