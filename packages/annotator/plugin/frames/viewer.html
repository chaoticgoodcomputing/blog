<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotator</title>
<!-- Inline: the page lives under Obsidian's Content Security Policy, which allows no stylesheet
     from the plugin's folder (frames/stylesheets.ts). PDF.js's own is added inlined by viewer.ts. -->
<style>
/* The viewer page: the PDF fills the frame, and scrolls in #viewerContainer, which PDF.js's
   PDFViewer requires to be absolutely positioned. Colours follow the plugin's theme when it
   passes them; until then, PDF.js's own. */

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--annotator-background, #525659);
}

#outerContainer {
  position: absolute;
  inset: 0;
}

#viewerContainer {
  position: absolute;
  inset: 0;
  overflow: auto;
}

.annotator-error {
  position: relative;
  z-index: 1;
  margin: 1em;
  padding: 0.75em 1em;
  border-radius: 4px;
  background: #fff;
  color: #b00020;
  font: 14px/1.4 system-ui, sans-serif;
}

/* Each page's number, in its corner: as a page range counts pages (src/pages.ts), from 1, not as
   the book prints them, so the number on a page is the one to put in `annotation-pages`. PDF.js
   numbers its pages so already; its loading icon has the page's ::after. */
.pdfViewer .page::before {
  content: attr(data-page-number);
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 10;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgb(0 0 0 / 0.55);
  color: #fff;
  font: 11px/1.4 system-ui, sans-serif;
  pointer-events: none;
}

/* Pages outside the note's page range (frames/viewer.ts): collapsed, not taken out of the layout.
   PDF.js finds the pages in view by a binary search over their positions, which must keep their
   order; a page with display: none has none, and stops every page after it being drawn. */
.pdfViewer .page.annotator-outside {
  height: 0 !important;
  margin: 0 !important;
  border: 0 !important;
  overflow: hidden;
  visibility: hidden;
}
</style>
</head>
<body>
<!-- PDF.js's own viewer layout, which the Hypothesis client's PDF integration looks for. -->
<div id="outerContainer">
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>
</div>
<script src="viewer.js"></script>
</body>
</html>
