# Only our libraries (`@chaoticgoodcomputing/*`) resolve through this workspace, so each one's own
# dependencies install beside its source. Plugins and the e2e suite keep their isolated npm
# installs, as a downstream site does, and Quartz Core is a pnpm project of its own
# (quartz-v5/core/pnpm-workspace.yaml), which this workspace never reaches. See ADR-0005's
# *libraries inlined by a plugin* amendment and quartz-v5/VENDORED.md.
packages:
  - quartz-v5/libs/*
