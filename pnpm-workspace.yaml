packages:
  - astro
  - packages/*
  # The Annotator: the Obsidian plugin and its libraries (packages/annotator/plugin/CONTEXT.md).
  - packages/annotator/*

autoInstallPeers: false

optimisticRepeatInstall: false

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  nx: false
  # The Annotator plugin's (packages/annotator/plugin): donation banners its build doesn't need.
  core-js: false
  es5-ext: false

patchedDependencies:
  hypothesis@1.1769.0: packages/annotator/plugin/patches/hypothesis@1.1769.0.patch
