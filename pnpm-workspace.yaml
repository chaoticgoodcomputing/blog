packages:
  - astro
  - packages/*
  # The Annotator: the Obsidian plugin, its libraries and the browser extension (packages/annotator/plugin/CONTEXT.md).
  - packages/annotator/*

autoInstallPeers: false

optimisticRepeatInstall: false

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  nx: false
  # The Annotator plugin's (packages/annotator/plugin): donation banners its build doesn't need.
  core-js: false
  es5-ext: false
  # The Annotator extension's (packages/annotator/extension): a polyfill for Node versions before child_process.spawnSync.
  spawn-sync: false
  # Unlighthouse's report (astro:seo-check): its script only picks Vue 2 or 3 shims, and it ships Vue 3's.
  vue-demi: false

patchedDependencies:
  hypothesis@1.1769.0: packages/annotator/plugin/patches/hypothesis@1.1769.0.patch
